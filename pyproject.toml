[project]
name = "sdr-engine"
version = "0.0.1"
description = "SDR Reactivation Engine for TCIA's HubSpot Prospecting pipeline"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pypdf2>=3.0",
    "msal>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "ruff>=0.5",
]

# This is an internal application, not a distributable Python package.
# We use `pip install -e .` purely to install dependencies for CI/dev.
# Tell setuptools NOT to auto-discover packages — the multiple top-level
# directories (ui/, n8n/, sql/, config/, prompts/) are not Python packages
# and the flat-layout heuristic would otherwise fail with:
#   "Multiple top-level packages discovered in a flat-layout"
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit a real external API (skip in CI without secrets)",
    "e2e: end-to-end tests requiring a running UI server",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter
